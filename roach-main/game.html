<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>蟑螂</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="stick"><div id="knob"></div></div>

  <div id="r1ui">
    <div id="wcol"></div>
    <div id="bcol"></div>
    <div id="kills"><span class="n">0</span><small>只</small></div>
    <div id="quit">要停下来吗？</div>
    <div id="confirm">
      <button class="stop">停下来</button>
      <button class="more">继续</button>
    </div>
  </div>

  <div id="r2ui">
    <canvas id="mini" width="176" height="264"></canvas>
    <div id="eggbar"></div>

    <div id="pad">
      <button id="egg" class="rbtn">产卵</button>
      <button id="dash" class="rbtn">冲刺</button>
    </div>

    <div id="tapfx"></div>
  </div>

<div id="vig"></div>
  <div id="tox"></div>
  <canvas id="deathfx"></canvas>
  <div id="hint"></div>
  <div id="genlabel"></div>
  <div id="fade"></div>
  <div id="endtext"></div>

  <div id="rank">
    <div class="now"></div>
    <div class="sub"></div>
    <div class="list"></div>
    <div class="again">点击屏幕，用同样的条件再来一局</div>
    <button class="allover">从头开始</button>
  </div>




</div>

<script src="vendor/three.local.js"></script>
<script src="js/game/01-core.js"></script>
<script src="js/game/02-audio.js"></script>
<script src="js/game/03-paint.js"></script>
<script src="js/game/04-room.js"></script>
<script src="js/game/05-items.js"></script>
<script src="js/game/06-roach.js"></script>
<script src="js/game/07-human.js"></script>
<script src="js/game/08-corpses.js"></script>
<script src="js/game/09-input.js"></script>
<script src="js/game/10-fx.js"></script>
<script src="js/game/11-round1.js"></script>
<script src="js/game/12-round2.js"></script>
<script src="js/game/13-ui.js"></script>
<script src="js/game/14-main.js"></script>
</body>
</html>
